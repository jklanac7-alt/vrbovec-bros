<!doctype html>
<html lang="hr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Vrbovec Bros</title>
<meta name="description" content="2D platformer smješten u Vrbovcu - trči, skači, gazi neprijatelje, skupljaj novčiće i stigni do zastave!" />
<meta name="theme-color" content="#5c94fc" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
<style>
  :root{
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #game-container {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #game {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game canvas {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  #boot-loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#5c94fc, #8fc0ff);
    color: #fff;
    font-weight: bold;
    letter-spacing: 1px;
    z-index: 5000;
  }
  #boot-loading .title {
    font-size: 28px;
    text-shadow: 3px 3px 0 #1a1a1a;
    margin-bottom: 18px;
  }
  #boot-loading .bar-track {
    width: 260px;
    height: 18px;
    border: 3px solid #1a1a1a;
    background: #1a1a1a;
    border-radius: 4px;
    overflow: hidden;
  }
  #boot-loading .bar-fill {
    height: 100%;
    width: 0%;
    background: #f4c430;
    transition: width 0.15s ease-out;
  }
  #boot-loading.hidden { display: none; }
  noscript {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #222;
    color: #fff;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
  </div>
  <div id="boot-loading">
    <div class="title">VRBOVEC BROS</div>
    <div class="bar-track"><div class="bar-fill" id="boot-bar-fill"></div></div>
  </div>
  <noscript>Ova igra zahtijeva omogućen JavaScript. / This game requires JavaScript to be enabled.</noscript>

  <script src="lib/phaser.min.js"></script>
  <script src="src/systems/SaveManager.js"></script>
  <script src="src/systems/DataStore.js"></script>
  <script src="src/systems/InputManager.js"></script>
  <script src="src/objects/Landmarks.js"></script>
  <script src="src/objects/TileRenderer.js"></script>
  <script src="src/objects/Player.js"></script>
  <script src="src/objects/Enemy.js"></script>
  <script src="src/objects/Collectibles.js"></script>
  <script src="src/ui/UIKit.js"></script>
  <script src="src/ui/HUD.js"></script>
  <script src="src/ui/Background.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/PreloadScene.js"></script>
  <script src="src/scenes/MainMenuScene.js"></script>
  <script src="src/scenes/CharacterSelectScene.js"></script>
  <script src="src/scenes/LevelSelectScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/PauseScene.js"></script>
  <script src="src/scenes/GameOverScene.js"></script>
  <script src="src/scenes/LevelCompleteScene.js"></script>
  <script src="src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
